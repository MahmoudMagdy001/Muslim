name: muslim
description: "Quran Reader & Player"
publish_to: "none"
version: 0.4.0+12

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  just_audio: ^0.10.5
  intl: ^0.20.2
  http: ^1.6.0
  shared_preferences: ^2.5.5
  google_fonts: ^9.0.0
  awesome_notifications: ^0.12.1
  just_audio_background: ^0.0.1-beta.17
  audio_service: ^0.18.18
  permission_handler: ^13.0.2
  flutter_qiblah: ^3.2.0
  flutter_bloc: ^9.1.1
  geolocator: ^14.0.2
  adhan: ^2.0.0+1
  hijri: ^3.0.0
  geocoding: ^5.0.0
  share_plus: ^13.2.0
  skeletonizer: ^3.0.0
  workmanager: ^0.10.10
  syncfusion_flutter_sliders: ^35.1.37
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.0
  path_provider: ^2.1.5
  in_app_review: ^2.0.12
  scrollable_positioned_list: ^0.3.8
  internet_state_manager: ^1.10.1+3
  flutter_screenutil: ^5.9.3
  get_it: ^9.2.1
  quran: ^1.4.1
  fpdart: ^1.1.1
  freezed_annotation: 3.1.0
  rxdart: ^0.28.0
  upgrader: ^13.0.0
  overmark: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: 2.16.1
  freezed: 4.0.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/json/azkar.json
    - assets/json/zekr.json
    - assets/json/azkar_en.json
    - assets/json/names_of_allah.json
    - assets/json/hisn_muslim_content.json
    - assets/home/
    - assets/quran/
    - assets/hadith/
    - assets/qiblah/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/muslim_logo.png"
  min_sdk_android: 21
